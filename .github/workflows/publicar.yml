name: Publicar sistemas KinseyTec

# Ao aprovar uma alteração na branch main, constrói e publica só os sistemas afetados
# (mudança no núcleo = todos). Também pode ser disparado manualmente pela aba Actions.
on:
  push:
    branches: [main]
    paths:
      - "nucleo/**"
      - "produtos/**"
      - "ferramentas/construir.py"
  workflow_dispatch:
    inputs:
      sistemas:
        description: 'Sistemas: "todos" ou produto/segmento separados por espaço (ex.: cadeias/soja cadeias/metal)'
        required: true
        default: "todos"

permissions:
  contents: read
  id-token: write   # login no Google Cloud sem chave guardada (Workload Identity Federation)

concurrency:
  group: publicar-kinseytec
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pillow
      - name: Construir todos os sistemas (confere se nada quebrou)
        run: python3 ferramentas/construir.py cadeias todos

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment: producao   # quem estiver em "Required reviewers" aprova antes de publicar
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pillow && npm install -g firebase-tools@13
      - name: Construir, publicar e conferir
        env:
          ESCOLHA: ${{ github.event.inputs.sistemas }}
        run: bash ferramentas/publicar_ci.sh
