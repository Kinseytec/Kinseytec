name: Publicar KinseyTec M&A

# Ao entrar uma alteração na branch main, testa, constrói e publica o KinseyTec M&A no Firebase
# (projeto kinsey-capital-ma). Também pode ser disparado manualmente pela aba Actions.
# Login no Google Cloud sem chave guardada (Workload Identity Federation): veja ferramentas/configurar_publicacao_automatica.sh
on:
  push:
    branches: [main, "claude/affectionate-ride-h3apqa"]   # a branch de trabalho: cada versão enviada daqui é publicada
    paths:
      - "nucleo/**"
      - "produtos/**"
      - "ferramentas/construir.py"
  workflow_dispatch:
    inputs:
      sistemas:
        description: 'Sistema a publicar (produto/segmento)'
        required: true
        default: "ma/capital"

permissions:
  contents: read
  id-token: write   # login no Google Cloud sem chave guardada (Workload Identity Federation)

concurrency:
  group: publicar-kinseytec
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pillow
      - name: Construir o M&A (confere se nada quebrou)
        run: python3 ferramentas/construir.py ma capital

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - name: Configuração única feita?
        if: ${{ vars.GCP_WIF_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '' }}
        run: |
          echo "::warning::Publicação automática aguardando a configuração única: crie as variáveis GCP_WIF_PROVIDER e GCP_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions > Variables). Veja o tutorial de publicação."
          { echo "## Publicação automática aguardando a configuração única"; echo ""; echo "O sistema foi montado e testado, mas ainda não foi publicado: faltam as variáveis **GCP_WIF_PROVIDER** e **GCP_SERVICE_ACCOUNT**."; echo "Rode uma vez configurar_publicacao_automatica.sh no Cloud Shell e crie as duas variáveis; a partir daí cada versão é publicada sozinha."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        with: { fetch-depth: 2 }
      - uses: google-github-actions/auth@v2
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
      - uses: actions/setup-node@v4
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        with: { node-version: "20" }
      - run: pip install pillow && npm install -g firebase-tools@13
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
      - name: Construir, publicar e conferir
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        env:
          ESCOLHA: ${{ github.event.inputs.sistemas || 'ma/capital' }}
        run: bash ferramentas/publicar_ci.sh
