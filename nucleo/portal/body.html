<style>
.pwrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.pwrap > *{grid-area:auto !important}
main.pscroll{overflow-y:auto;position:relative}
.pinner{max-width:760px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.wsteps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:var(--navy);border-bottom:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left,0px)) 8px max(10px,env(safe-area-inset-right,0px))}
.wsteps button{background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 2px;line-height:1.15;text-align:center}
.wsteps .sn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px}
.wsteps button[aria-current="step"]{color:var(--fog)}
.wsteps button[aria-current="step"] .sn{background:var(--accent);border-color:var(--accent);color:#fff}
.wsteps button.done .sn{background:rgba(54,211,153,.18);border-color:var(--ok);color:var(--ok)}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--panel)}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.ph div{padding:8px 10px;font-size:12px;color:var(--muted)}
.admins{font-size:12.5px;color:var(--muted)}
.admins b{color:var(--fog);font-family:var(--f-mono);font-weight:500;user-select:all}
</style>
<div class="pwrap">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="__LOGO__" alt="Kinsey BR" width="34" height="34">
      <div><b>Kinsey<span>Tec</span> <em class="sys">– Cacau</em></b><small>Portal do Fornecedor</small></div>
    </div>
    <div class="sp"></div>
    <span class="modechip" id="saved">Rascunho salvo neste aparelho</span>
  </header>
  <nav class="wsteps" id="wsteps" aria-label="Etapas"></nav>
  <main class="pscroll" id="pscroll"><div class="pinner" id="pbody"></div></main>
</div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script>
__JS__
</script>
