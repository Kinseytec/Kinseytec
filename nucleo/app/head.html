<title>KinseyTec – Cacau</title>
<meta name="theme-color" content="#011F4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KinseyTec Cacau">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen mission-control app — top bar, live view, bottom nav (side rail on desktop). Deliberately single dark "orbital" theme in KinseyTec colours (branding book KinseyTec, nov/2026: Navy #011F4B dominante, Azul #0473C3, Ciano Tec #38B6FF, Fog #E6E8EC). */
:root{
  --navy:#011F4B;          /* Kinsey Navy */
  --space:#000A1C;         /* deep space ground, navy-biased */
  --panel:#06234F;         /* raised surface */
  --panel-2:#0A2D60;
  --line:rgba(150,190,240,.16);
  --line-2:rgba(150,190,240,.30);
  --accent:#0473C3;        /* Kinsey Acent */
  --glow:#38B6FF;          /* Ciano Tec (branding book KinseyTec): pontos de conexão e "Tec" sobre o navy */
  --ocean:#0A5CA8;         /* Azul Oceano: globo e fundos secundários */
  --americas:#7CCBFF;      /* Azul Américas: ilustrações */
  --fog:#E6E8EC;           /* Kinsey Fog — primary text */
  --muted:#93A3BC;         /* Kinsey Gray, shifted toward navy */
  --ok:#36D399; --warn:#F2B33D; --bad:#FF6B6B;
  --f-display:"Montserrat", "Segoe UI", Arial, sans-serif;
  --f-body:"Montserrat", Arial, "Helvetica Neue", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--space);color:var(--fog);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "price" "main" "nav"}
.topbar{grid-area:top;background:var(--navy);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg,.brand .logo{width:40px;height:40px;flex:none}   /* branding book: símbolo com no mínimo 40 px nas telas */
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em;line-height:1}
.brand b span{color:var(--glow)}
.brand b .sys{font-style:normal;font-weight:600;color:var(--fog)}
.brand b{white-space:nowrap}
@media (max-width:440px){.brand b{font-size:15px}.brand small{display:none}.brand b .sys{display:none}.topbar{gap:8px}.kimbtn{padding:6px 9px;font-size:11px}}
.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.langbtn{display:inline-flex;border:1px solid var(--line-2);border-radius:99px;overflow:hidden;flex:none}
.langbtn button{background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 9px;cursor:pointer;letter-spacing:.04em}
.langbtn button[aria-pressed="true"]{background:var(--accent);color:#fff}
.kimbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--glow);background:rgba(4,115,195,.25);color:var(--fog);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.kimbtn .kdot{width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow)}
@media (max-width:440px){.modechip{display:none}.brand small{max-width:150px}}
.kimvid{width:100%;border-radius:12px;border:1px solid var(--line-2);background:#000;aspect-ratio:16/9;max-width:100%}
.modechip{font-size:11px;font-weight:600;letter-spacing:.06em;padding:5px 9px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.modechip.live{color:var(--ok);border-color:rgba(54,211,153,.4)}
.modechip.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;box-shadow:0 0 8px var(--ok)}

main{grid-area:main;position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

nav.tabs{grid-area:nav;display:grid;grid-template-columns:repeat(6,1fr);background:var(--navy);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button[aria-current="page"]{color:var(--fog)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--glow);box-shadow:0 0 10px var(--glow)}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#1b1300;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

@media (min-width:900px){
  #app{grid-template-columns:92px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "price price" "nav main"}
  nav.tabs{grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding-top:12px;gap:4px}
  nav.tabs button{padding:12px 4px}
  nav.tabs button[aria-current="page"]::before{top:20%;bottom:20%;left:0;right:auto;width:2px;height:auto}
}

/* ---------- COTAÇÃO ---------- */
.pricebar{grid-area:price;display:flex;align-items:center;gap:14px;border:0;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#03224f,#06306a);color:var(--fog);padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;cursor:pointer;text-align:left;overflow:hidden;white-space:nowrap;position:relative;z-index:4}
.pricebar .lab{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.pricebar .lab i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pricebar .lab i.old{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.pricebar .px{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pricebar .px b{font-size:14px;color:var(--fog);font-weight:500}
.pricebar .px span{color:var(--muted);margin-right:4px}
.pricebar .more{margin-left:auto;color:var(--glow);font-weight:600}
@media (max-width:560px){.pricebar .hide-sm{display:none}}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable td,.ptable th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ptable th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ptable .v{font-family:var(--f-mono);font-size:15px}
.bigprice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bigprice .stat .n{font-size:26px}

/* ---------- ÓRBITA ---------- */
#v-orbita{overflow:hidden;background:var(--space)}
#globe{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#globe:active{cursor:grabbing}
.hud{position:absolute;pointer-events:none;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.hud b{color:var(--fog);font-weight:500}
.hud-tl{top:12px;left:max(14px,env(safe-area-inset-left,0px))}
.hud-tr{top:12px;right:max(14px,env(safe-area-inset-right,0px));text-align:right}
.hud-line{display:block;line-height:1.7}
.ctrls{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:64px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.ctrls button,.lvl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:rgba(1,31,75,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--fog);font-size:18px;cursor:pointer;display:grid;place-items:center}
.ctrls button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.lvl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:84px;display:flex;flex-direction:column;gap:6px}
.lvl button{width:auto;padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.06em;height:30px;opacity:.45}
.lvl button[aria-pressed="true"]{opacity:1;border-color:var(--glow)}

.dock{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;padding-bottom:12px;pointer-events:none}
.target{pointer-events:auto;font-size:13px;margin-left:max(12px,env(safe-area-inset-left,0px));margin-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(6,35,79,.86),rgba(1,20,48,.92));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-2);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:5px 10px;max-width:560px;position:relative}
.target::before,.target::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--glow);pointer-events:none}
.target::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.target::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.target .loc{font-family:var(--f-mono);font-size:11px;color:var(--glow);letter-spacing:.08em;text-transform:uppercase}
.target h3{font-size:15px;margin-top:1px;line-height:1.25}
.target .coords{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.target .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.target .photos{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto}
.target .photos img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line-2);flex:none;cursor:pointer}
.target .photos .nophoto{font-size:11.5px;color:var(--muted);padding:2px 0}
.target .xs{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px}
.target .side{padding-right:22px}
.strip{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;border:1px solid var(--line-2);background:rgba(1,31,75,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--fog)}
.chip[aria-pressed="true"]{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow) inset}
.chip .lv{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

/* ---------- shared UI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--fog);min-height:38px}
.btn:hover{border-color:var(--glow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0A84DB}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12px}
.btn.ok{background:rgba(54,211,153,.14);border-color:rgba(54,211,153,.5);color:var(--ok)}
.btn.warn{background:rgba(242,179,61,.12);border-color:rgba(242,179,61,.5);color:var(--warn)}
.btn.bad{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.5);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.r-alto{color:var(--bad);background:rgba(255,107,107,.13)}
.r-medio{color:var(--warn);background:rgba(242,179,61,.13)}
.r-baixo{color:var(--ok);background:rgba(54,211,153,.12)}
.r-pend{color:var(--muted);background:rgba(147,163,188,.14)}
.lvtag{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;border:1px solid var(--line-2);color:var(--glow)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head > div{min-width:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-family:var(--f-mono);font-size:24px;font-weight:500;color:var(--fog);line-height:1.1}
.stat .l{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbtn{border:1px solid var(--line-2);background:transparent;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.fbtn[aria-pressed="true"]{background:var(--panel-2);color:var(--fog);border-color:var(--glow)}
.search{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;font-size:13px}

/* tree */
.tree{display:flex;flex-direction:column;gap:8px}
.node{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.node .row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.node .row:hover{background:var(--panel-2)}
.node .kids{border-top:1px solid var(--line);padding:6px 0 6px 22px;display:flex;flex-direction:column}
.node .kids .node{border:0;border-left:1px dashed var(--line-2);border-radius:0;background:transparent}
.row .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
@media (max-width:560px){.node .row .prog{display:none}}
.row .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.row .right{display:flex;align-items:center;gap:8px}
.prog{width:54px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--glow)}
.blist td{vertical-align:middle}.blist{font-size:12.5px}.blist th,.blist td{padding:7px 6px}.blist .pill{white-space:nowrap}
.blist tbody tr[data-open]{cursor:pointer}
.blist tbody tr[data-open]:hover{background:var(--panel-2)}
.blist tr.root td{background:rgba(4,115,195,.14);border-bottom:1px solid var(--line-2)}
.sortb{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:0;white-space:nowrap}
.qcls{background:var(--space);border:1px solid var(--line-2);border-radius:8px;padding:5px 6px;font-size:12px;color:var(--fog)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,6,18,.66);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--navy);border:1px solid var(--line-2);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
@media (min-width:900px){.scrim{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line-2);max-height:88%}}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-h > div{flex:1;min-width:0}
.sheet-fim{display:flex;justify-content:flex-end;padding-top:4px}.sheet-h .x{flex:none}
.sheet-h,.stabs{flex-shrink:0}.sheet-b{flex:1 1 auto;min-height:0}   /* abas do dossiê nunca são espremidas pelo conteúdo */
.sheet-b{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.x{background:none;border:1px solid var(--line-2);border-radius:10px;width:36px;height:36px;cursor:pointer;color:var(--fog);font-size:18px;flex:none}
.stabs{display:flex;gap:4px;overflow-x:auto;padding:0 18px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.stabs button[aria-selected="true"]{color:var(--fog);border-color:var(--glow)}
.stabs .sn{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);font-size:10.5px;margin-right:6px;font-family:var(--f-mono)}
.stabs button[aria-selected="true"] .sn{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:640px){.stabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:4px 10px;overflow:visible}.stabs button{padding:8px 4px;font-size:11.5px;white-space:normal;line-height:1.2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}.stabs .sn{margin:0}}
.stepnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.nda-full > summary h3{margin:0}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lb{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.fld input,.fld select,.fld textarea{background:var(--space);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;font-size:14px;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}
.err{color:var(--bad);font-size:12.5px}

/* questions */
.qgroup{display:flex;flex-direction:column;gap:2px}
.qgroup > .eyebrow{margin:8px 0 6px}
.q{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.q .qn{font-family:var(--f-mono);font-size:12px;color:var(--glow);padding-top:2px}
.q .qt{font-size:14px;max-width:70ch}
.q .qa{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.q .qa input[type=text]{flex:1;min-width:180px;background:var(--space);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"].v-sim{background:rgba(4,115,195,.35);color:var(--fog)}
.seg button[aria-pressed="true"].v-nao{background:rgba(147,163,188,.25);color:var(--fog)}
.seg button[aria-pressed="true"].v-na{background:rgba(147,163,188,.14);color:var(--fog)}
.seg button[aria-pressed="true"].risk{background:rgba(255,107,107,.25);color:#ffd2d2}
.q .flag{font-size:11px;color:var(--bad);font-weight:700;letter-spacing:.04em}
.lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.lib{grid-template-columns:1fr}}
.lib ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.lib ol li::marker{font-family:var(--f-mono);color:var(--glow);font-size:12px}
details.card > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:"+";font-family:var(--f-mono);color:var(--glow);font-size:18px}
details.card[open] > summary::after{content:"–"}

/* risk */
.why{border-radius:12px;padding:10px 12px;font-size:13px;border:1px solid var(--line-2);background:var(--space)}
.why ul{margin:6px 0 4px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.why-alto{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}.why-alto b{color:var(--bad)}
.why-medio{border-color:rgba(242,179,61,.5);background:rgba(242,179,61,.07)}.why-medio b{color:var(--warn)}
.why-baixo{border-color:rgba(54,211,153,.45);background:rgba(54,211,153,.06)}.why-baixo b{color:var(--ok)}
.target .why{font-size:12px;padding:7px 10px}.target .why ul{margin:4px 0 0}
.reasons{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.reasons li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--space);border:1px solid var(--line)}
.reasons .pts{font-family:var(--f-mono);color:var(--warn)}
.reasons .crit{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.calc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.result{font-family:var(--f-mono);font-size:13px;padding:10px 12px;border-radius:9px;background:var(--space);border:1px solid var(--line)}

/* evidence */
.grid-ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:var(--fog)}
.ev .th{aspect-ratio:4/3;max-width:100%;background:var(--space);display:grid;place-items:center;position:relative;overflow:hidden}
.ev .th img{width:100%;height:100%;object-fit:cover}
.ev .th .doc{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ev .th .gps{position:absolute;left:6px;top:6px;font-family:var(--f-mono);font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(0,10,28,.75)}
.ev .bd{padding:9px 10px;display:flex;flex-direction:column;gap:3px}
.ev .bd b{font-size:12.5px;font-weight:600}
.ev .bd span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.preview{max-width:100%;border-radius:10px;border:1px solid var(--line-2)}

/* contracts */
.ct{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.ct:hover{border-color:var(--line-2)}
.ct > .pill{align-self:start}
.ct .meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.st-pendente{color:var(--warn);background:rgba(242,179,61,.13)}
.st-aprovado{color:var(--ok);background:rgba(54,211,153,.12)}
.st-ressalvas{color:#7EC8FF;background:rgba(56,182,255,.14)}
.st-reprovado{color:var(--bad);background:rgba(255,107,107,.13)}
.clauses{display:flex;flex-direction:column;gap:8px}
.banner{font-size:12.5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);color:var(--muted)}
.banner b{color:var(--fog)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fog);color:var(--navy);font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.lightbox{position:fixed;inset:0;background:rgba(0,4,12,.92);z-index:30;display:grid;place-items:center;padding:20px}
.lightbox img{max-height:86%;max-width:100%;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
